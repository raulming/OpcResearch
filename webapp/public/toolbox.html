<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>极简创业验证工具箱</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Minimalist Entrepreneur Toolbox</p>
        <h1>极简创业验证工具箱</h1>
      </div>
      <a class="ghost-link" href="/">返回自测</a>
    </header>

    <main class="shell">
      <section class="hero">
        <div class="hero-copy">
          <h2>免费生成 1 份完整创业验证计划</h2>
          <p>把你的想法变成可执行的 7 天验证任务，包含想法假设、客户访谈、服务包/MVP 和试单判断标准。</p>
        </div>
        <div class="hero-panel">
          <span>本次原价</span>
          <strong>80 验证积分</strong>
          <small>新用户可免费完整体验 1 次</small>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <p class="step">01</p>
          <div>
            <h2>填写最小验证信息</h2>
            <p>请尽量写具体。越具体，生成的计划越容易直接执行。</p>
          </div>
        </div>

        <form id="toolboxForm" class="form-grid">
          <label>姓名或昵称<input name="name" placeholder="例如：明哥" /></label>
          <label>联系方式<input name="contact" required placeholder="微信 / 手机 / 邮箱" /></label>
          <label>当前职业 / 专业能力<input name="role" placeholder="例如：运营、咨询师、产品经理" /></label>
          <label>想服务的人群<input name="targetUser" required placeholder="例如：本地门店老板、职场新人" /></label>
          <label>想解决的问题<input name="painPoint" required placeholder="例如：不会用 AI 做获客内容" /></label>
          <label>第一版想提供什么<input name="offer" placeholder="例如：一次 AI 获客内容诊断 + 7 天选题表" /></label>
          <label>已有触达渠道<input name="channel" placeholder="例如：朋友圈、社群、老客户、小红书" /></label>
          <label>每周可投入时间
            <select name="weeklyTime">
              <option value="每周 3 小时以内">每周 3 小时以内</option>
              <option value="每周 3-8 小时">每周 3-8 小时</option>
              <option value="每周 8-20 小时">每周 8-20 小时</option>
              <option value="每周 20 小时以上">每周 20 小时以上</option>
            </select>
          </label>
          <label>邀请码<input name="inviteCode" placeholder="从自测自动带入，可选" /></label>
          <label>试单价格预期<input name="price" placeholder="例如：99 元、199 元、499 元" /></label>
          <label class="wide">你的优势或资源<textarea name="strengths" rows="3" placeholder="例如：懂本地生活运营、有 3 年咨询经验、朋友圈有 1000 个精准好友"></textarea></label>
          <button class="primary wide" type="submit">免费生成我的验证计划</button>
        </form>
      </section>

      <section id="toolboxResult" class="result hidden" aria-live="polite"></section>
    </main>

    <script src="/toolbox.js"></script>
  </body>
</html>
